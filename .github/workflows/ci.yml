name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Default types omit `edited`, which fires when the base branch is
    # retargeted — and the base is exactly what the history scan measures
    # against, so its verdict can change without a new commit.
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  # Newer pushes to the same PR/branch cancel in-flight CI for that ref so only
  # the latest commit is evaluated. Cancelled jobs can appear briefly with no
  # useful steps in the UI; check the newest successful run for Frontend/Backend.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately its own job with no toolchain, no services and no build step.
  # As part of the backend job it ran only after restore, build and the
  # out-of-solution build all succeeded — and a PR that does not compile is
  # exactly the one most likely to carry a stray probe, so the author would get
  # no hygiene feedback at all.
  hygiene:
    name: Clean timeline
    runs-on: ubuntu-latest
    # No toolchain and no services, so anything past a couple of minutes means
    # the job is wedged rather than slow.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # The history scan walks base..HEAD, which a shallow clone cannot do.
          fetch-depth: 0

      - name: Reject non-Coder files on the timeline
        env:
          # Empty for a push build, where there is no base to compare against;
          # the script then runs the tip checks only.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A merge_group event carries no pull_request payload, so BASE_SHA is
          # empty there and the history scan would quietly degrade to the tip
          # check — in the queue that is the last gate before the base branch.
          # merge_group.base_sha is the equivalent, so use it when present.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] && [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
            echo "using merge_group base"
          fi
          if [ -n "$BASE_SHA" ]; then
            # The merge base, not the raw base sha. github.event...base.sha is
            # the base branch tip when the PR opened; once the base moves on,
            # a range from it sweeps in commits this PR never touched and the
            # scan blames the author for someone else's file.
            # On a pull_request checkout HEAD is GitHub's merge commit, whose
            # first parent is the base and second is the PR tip. merge-base of
            # the base against that merge commit resolves back to BASE_SHA, so
            # the range sweeps in every commit the base gained after the PR
            # opened -- the false blame the merge-base was meant to prevent.
            # Compare from the PR tip instead.
            tip="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
            merge_base="$(git merge-base "$BASE_SHA" "$tip")"
            echo "base=$BASE_SHA tip=$tip merge-base=$merge_base"
            ./scripts/check-clean-timeline.sh --history "$merge_base"
          else
            ./scripts/check-clean-timeline.sh
          fi

  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16@sha256:4f6c1ec9743885ba6438a91f7c08c4ef4d645a41eae31fc8521c2d831c622107
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homework_central_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homework_central_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=homework_central_test;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.301
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HomeworkCentral.sln

      - name: Build
        run: dotnet build HomeworkCentral.sln --configuration Release --no-restore

      # PostgresHostCheck is not a member of HomeworkCentral.sln, so the solution
      # build above never compiles it and its IDE0008 gate would never run.
      - name: Build projects outside the solution
        run: dotnet build scripts/PostgresHostCheck/PostgresHostCheck.csproj --configuration Release

      - name: Reject implicitly typed locals
        run: ./scripts/check-no-var.sh

      # Plants a real `var` in every tracked project and requires the compiler
      # to reject it. Inspecting the configuration instead was defeated three
      # times running: a text scan missed `<!-- vendored --><NoWarn>…`,
      # -getProperty missed a target-time NoWarn append, and a parsed
      # .editorconfig missed section scoping. Building the code cannot miss any
      # of them, because the compiler is the thing being asked.
      #
      # --csharp, not both halves: this job has dotnet and no node_modules, and
      # asserting the web half from here is what turned the branch red.
      - name: Verify the no-var analyzers reject a var
        env:
          STRICT: '1'
        run: ./scripts/check-no-var-config.sh --csharp

      # Scoped to the whole repo, not just backend/HomeworkCentral.Api: a new
      # project was outside the pattern and unscanned. `\s*\(` because a single
      # space (`FromSqlRaw (`) evaded the previous form, and `-U` so a newline
      # before the paren does not either.
      #
      # This is a lint, not a proof. It cannot see raw ADO.NET at all --
      # TenantDatabaseProvisioner interpolates a database name into a CREATE
      # DATABASE statement, which is correct today because the identifier is
      # escaped by doubling `"` and comes from a fixed catalog rather than
      # request input, but deleting that escape would not trip this step. Raw
      # ADO.NET command text stays a review responsibility.
      - name: Reject unparameterized raw SQL
        run: |
          if rg -n -U '(FromSqlRaw|ExecuteSqlRaw|ExecuteSqlRawAsync|SqlQueryRaw)\s*\(' --type cs; then
            echo "Unparameterized raw SQL is not allowed. Use FromSqlInterpolated/ExecuteSqlInterpolated/SqlQuery."
            exit 1
          fi

      - name: Test
        run: dotnet test HomeworkCentral.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ignores every inline directive. A blanket `/* eslint-disable */` or a
      # bare `// eslint-disable-next-line` names no rule, so it silenced no-var
      # while a scan looking for the rule name near the directive saw nothing.
      - name: Lint ignoring inline directives
        run: npm run lint:ci

      # Resolves the effective config for every tracked web file and requires
      # both rules to come out as error, then plants a var behind a blanket
      # /* eslint-disable */ and requires lint:ci to reject it. Sampling four
      # representative files instead was a complete escape: a block scoped to
      # src/components/** with 'no-var': 'off' passed every gate end to end.
      #
      # --web, not both halves: this job has node and no setup-dotnet step.
      - name: Verify the no-var rules cover every web file
        env:
          STRICT: '1'
        run: ../scripts/check-no-var-config.sh --web

      - name: Build
        run: npm run build

  llm-service:
    name: LLM service (shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Syntax-check entrypoint
        run: bash -n llm-service/entrypoint.sh

      - name: Reject unpinned Ollama base image
        run: |
          if grep -nE 'FROM[[:space:]]+ollama/ollama:latest' llm-service/Dockerfile; then
            echo "llm-service/Dockerfile must pin ollama/ollama to a version tag, not :latest."
            exit 1
          fi
          if ! grep -nE 'OLLAMA_VERSION=0\.[0-9]+' llm-service/Dockerfile; then
            echo "llm-service/Dockerfile must declare OLLAMA_VERSION=<major.minor.patch>."
            exit 1
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target

      - name: Build
        run: cargo build --workspace --locked

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace
