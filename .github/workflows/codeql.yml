name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly refresh so default-branch alerts stay current without a PR.
    - cron: '17 7 * * 1'


# Least privilege at the workflow level, so a job that forgets its own
# permissions block does not inherit write scopes from the default token.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload SARIF results to the repository security/code-scanning tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.301
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build C# for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          set -euo pipefail
          dotnet restore HomeworkCentral.sln
          dotnet build HomeworkCentral.sln --configuration Release --no-restore
          # PostgresHostCheck is not a member of the solution, so the build above
          # leaves it out of the CodeQL database entirely.
          dotnet build scripts/PostgresHostCheck/PostgresHostCheck.csproj --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
