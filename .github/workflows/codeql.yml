name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly refresh so default-branch alerts stay current without a PR.
    - cron: '17 7 * * 1'


# Least privilege at the workflow level, so a job that forgets its own
# permissions block does not inherit write scopes from the default token.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload SARIF results to the repository security/code-scanning tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.301
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build C# for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          set -euo pipefail
          dotnet restore HomeworkCentral.sln
          dotnet build HomeworkCentral.sln --configuration Release --no-restore
          # PostgresHostCheck is not a member of the solution, so the build above
          # leaves it out of the CodeQL database entirely.
          dotnet build scripts/PostgresHostCheck/PostgresHostCheck.csproj --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
