[package]
name = "hc-kernels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "C ABI for chat-monitor kernels; loaded by the API when present"

[lib]
name = "hc_kernels"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
hc-feature-encode = { path = "../hc-feature-encode" }
hc-vector-cosine = { path = "../hc-vector-cosine" }
hc-gemv = { path = "../hc-gemv" }
